{% extends 'base.html' %}
{% load static %}

{% block meta_tags %}
<link rel="stylesheet" href="{% static 'css/blog.css' %}">
{% endblock %}


{% block title %}Blog{% endblock %}


{% block content %}

<h2>Blog</h2>
<div class="projects_column">
    {% for post in posts %}
        <div class="project_card">
            <div class="card__header">
                <p class="card__header__p">{{ post.created_at }}</p>
                <h4 class="card__header_title">{{ post.title }}</h4>
                <p class="card__header__p">{{ post.description }}</p>
            </div>

            <a href="/post/{{post.slug}}/">Read</a>
        </div>
    {% endfor %}
</div>


{% endblock %}
