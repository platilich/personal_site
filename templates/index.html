{% extends 'base.html' %}



{% block title %}Plat Ilich{% endblock %}



{% block content %}


<div class="grid_2_column">
    <div class="block">
        <div class="block__header">
            <img class="image" src="media/{{profile.avatar}}">

            <div class="block__header__title">
                <h2 class="name">{{ profile.name }}</h2>
                <p class="specification">{{ profile.specification }}</p>
            </div>

        </div>

        <p>{{ profile.about_me }}</p>
    </div>

    <div>
        <h2>My best projects</h2>

        <div class="projects_column">
            {% for project in projects %}
            <div class="project_card">
                <div class="card__header">
                    <h4 class="card__header_title">{{ project.title }}</h4>
                    <p class="card__header__p">{{ project.description }}</p>
                </div>
                <a href="{{ project.url }}" target="_blank">Open</a>

            </div>
            {% endfor %}

        </div>

    </div>

</div>





{% endblock %}
